[project]
name = "notebooks"
version = "0.1.0"
description = "Collection of Notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "marimo[mcp,recommended]>=0.23.1",
    "numpy>=2.4.4",
    "polars[pandas]>=1.44.2",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.2",
    "polars[pyarrow]>=1.39.3",
    "pyrefly>=1.3.1",
    "sqlglot>=30.4.3",
]

[tool.marimo.diagnostics]
enable = true

[tool.marimo.language_servers.pyrefly]
enabled = true

[tool.marimo.language_servers.basedpyright]
enabled = false

